# =============================================================================
# Chef iQ — AI Cook Coach (5-minute poll, powered by HA AI Task)
# =============================================================================
# Every 5 minutes DURING AN ACTIVE COOK, sends the live sensor + derived-
# intelligence state to an LLM and gets back ONE short, expert, natural-language
# insight ("safe and done — pull it now to rest; juiciness dropping"). The
# insight is stored in input_text.chef_iq_ai_coach and shown on the dashboard;
# optionally announced on the kitchen Sonos.
#
# WHY AN LLM ON TOP OF THE SENSORS? The template sensors already compute the
# facts (pasteurization %, juiciness, carryover, phase). The LLM turns those
# facts into a single prioritised, human judgement call — the bit that's hard
# to express in Jinja.
#
# ✨ ZERO CONFIG FILE EDIT: this uses Home Assistant's built-in **AI Task**
# (ai_task.generate_data), so it works with whatever AI Task provider you have
# configured (OpenAI, Anthropic, Google, Ollama, …). No rest_command, no API
# key in YAML, no restart. Just create the helpers + automation (all do-able in
# the UI). Set the entity_id below to YOUR ai_task entity.
#
# COST: ~1 small call per 5 min while cooking — fractions of a penny per cook.
# It only polls while actively cooking, so rest/idle cost nothing (see conditions).
#
# (Prefer an external provider like Mistral instead of AI Task? See the
#  "ALTERNATIVE" block at the very bottom of this file.)
# =============================================================================

# ── Helpers (or create in the UI) ────────────────────────────────────────────
input_text:
  chef_iq_ai_coach:
    name: Chef iQ AI Coach
    max: 255
    icon: mdi:robot-happy

input_boolean:
  chef_iq_ai_announce:
    name: Chef iQ AI Announce
    icon: mdi:bullhorn

input_datetime:
  chef_iq_ai_coach_updated:
    name: Chef iQ AI Coach Updated
    has_date: true
    has_time: true

# ── The 5-minute poll (Automations editor → edit in YAML) ────────────────────
automation:
  - id: chefiq_ai_coach_poll
    alias: "ChefIQ · AI Coach (5 min)"
    description: Poll the LLM every 5 min ONLY while actively cooking (skips rest/idle to save tokens).
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/5"
    conditions:
      # Only poll while ACTIVELY cooking, so we never burn tokens during rest/idle.
      - condition: state
        entity_id: input_boolean.chefiq_cook_active
        state: "on"
      - condition: state
        entity_id: input_boolean.chef_iq_resting
        state: "off"
      - condition: state
        entity_id: input_boolean.chef_iq_cooling
        state: "off"
      # Probe connected AND heat still being applied (core still rising, OR
      # oven/ambient at least 5 °C hotter than the core). When you pull the food,
      # the rate falls to ~0 and ambient drops below the core, so polling stops.
      - condition: template
        value_template: >-
          {% set core = states('sensor.chefiq_meat_temperature')|float(-999) %}
          {% set amb  = states('sensor.chefiq_ambient_temperature')|float(-999) %}
          {% set rate = states('sensor.chefiq_meat_rate')|float(0) %}
          {{ core > -50 and (rate >= 0.1 or (amb - core) >= 5) }}
    actions:
      # HA AI Task with a single structured "insight" field. Change the
      # entity_id to YOUR ai_task entity (Developer Tools → States → ai_task.*).
      - action: ai_task.generate_data
        continue_on_error: true
        response_variable: out
        data:
          entity_id: ai_task.openai_ai_task_3
          task_name: ChefIQ Cook Coach
          instructions: >-
            You are a concise expert cooking assistant monitoring a smart meat
            probe. Give ONE short, friendly, actionable insight (max 2
            sentences). Be specific about food safety and doneness, use the
            data, never invent numbers. If the food is done and safe, say so
            and advise the next step (rest or pull). Add judgement; do not just
            repeat numbers the user can already see.

            Live cook data (Celsius). Mode: {{ states('input_select.chef_iq_probe_mode') }},
            Meat type: {{ states('input_select.chef_iq_meat_type') }},
            Core: {{ states('sensor.chefiq_meat_temperature') }},
            Oven/ambient: {{ states('sensor.chefiq_ambient_temperature') }},
            Rate C/min: {{ states('sensor.chefiq_meat_rate') }},
            Target: {{ states('input_number.chefiq_target_temperature') }},
            Pasteurization %: {{ states('sensor.chef_iq_pasteurization') }},
            Food safety: {{ states('sensor.chef_iq_food_safety') }},
            Phase: {{ states('sensor.chef_iq_cook_phase') }},
            Juiciness %: {{ states('sensor.chef_iq_juiciness') }},
            Predicted final: {{ states('sensor.chef_iq_predicted_final_temp') }}
          structure:
            insight:
              description: One short expert insight, max 2 sentences
              selector:
                text:
      - variables:
          insight: >-
            {{ out.data.insight | default('') if (out is defined and out.data is defined and out.data is mapping) else '' }}
      - condition: template
        value_template: "{{ insight | length > 3 }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.chef_iq_ai_coach
        data:
          value: "{{ insight[:255] }}"
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.chef_iq_ai_coach_updated
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - if:
          - condition: state
            entity_id: input_boolean.chef_iq_ai_announce
            state: "on"
        then:
          # No volume: the announce script speaks relative to the current music
          # level (music + boost), so it ducks proportionally. See kitchen_announce.yaml.
          - action: script.chefiq_kitchen_announce
            data:
              message: "{{ insight }}"

